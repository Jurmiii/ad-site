<!--
  Money Calendar — 레이아웃·컴포넌트 계약 (문서용)
  이 폴더의 HTML은 페이지에 include 되지 않습니다.
  실제 주입: assets/js/app-shell.js + assets/js/nav-config.js

  ┌─ CSS 계층 ──────────────────────────────────────────┐
  │ common.css       토큰·btn/card/input·헤더(sticky 공통)·푸터·토글  │
  │ journal-shell.css mc-app 셸·드로어·즐겨찾기·인트로   │
  │ style.css        홈(page-home) 전용 본문             │
  │ {feature}.css    화면별                             │
  └────────────────────────────────────────────────────┘

  ┌─ 기능 페이지 골격 ──────────────────────────────────┐
  │ body.mc-app[data-mc-feature-id]                      │
  │   header.mc-global-header  ← sticky (common.css)     │
  │     .mc-brand + .mc-global-header__tools             │
  │     (#mc-fav-bar / #mc-fav-dropdown ← JS 주입)       │
  │   #drawer → #mc-drawer-list ← JS                     │
  │   .mc-app__canvas > .container > #main               │
  │     .mc-page-intro                                   │
  │     #excel-control-root (선택)                       │
  │     section.card …                                   │
  │   footer.page-foot                                   │
  └────────────────────────────────────────────────────┘

  ┌─ 홈 골격 ───────────────────────────────────────────┐
  │ body.page-home                                       │
  │   header.site-header  ← sticky (common.css)          │
  │   #drawer                                            │
  │   main.home-main > .home-shell                       │
  │   footer.site-footer                                 │
  └────────────────────────────────────────────────────┘
-->

<!-- 즐겨찾기: app-shell.js가 주입. 스타일 = journal-shell.css -->
<nav id="mc-fav-bar" class="mc-fav-bar" aria-label="즐겨찾기 바로가기"></nav>
<details id="mc-fav-dropdown" class="mc-fav-dropdown" aria-label="즐겨찾기 바로가기"></details>
