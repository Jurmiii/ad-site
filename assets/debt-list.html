          <p class="mc-page-intro__kicker">0원으로 가기 위한 정직한 직면</p>
          <p class="mc-page-intro__lead text-body">빚을 성격별로 분리해 적고, 감정이 아닌 순서로 상환 계획을 세우는 출발점입니다.</p>

        <section id="section-1" class="guide-section">
          <h3>1. 부채 리스트 (0원으로 가는 첫걸음)</h3>
          <p class="philosophy-text">"부채를 기록하는 것은 비전을 향한 정직한 직면입니다."</p>
          <form class="debt-form" style="max-width: 560px">
            <label class="field">
              <span class="field-label">부채명</span>
              <input type="text" placeholder="예: OO은행 햇살론" />
            </label>
            <label class="field mt-16">
              <span class="field-label">잔액</span>
              <input type="number" placeholder="상환 잔액" />
            </label>
            <label class="field mt-16">
              <span class="field-label">종류(긴급/일반/협의)</span>
              <select>
                <option value="urgent">긴급</option>
                <option value="normal">일반</option>
                <option value="memo">협의</option>
              </select>
            </label>
            <label class="field mt-16">
              <span class="field-label">메모</span>
              <textarea placeholder="상환 계획 및 메모"></textarea>
            </label>
          </form>
          <div class="tip-box"
            style="margin-top: 15px; padding: 10px; background: #f9f9f9; border-left: 4px solid #333;">
            <small>💡 Tip: 현실적으로 상환 가능한 금액으로 쪼개서 끝까지 완주하세요.</small>
          </div>
        </section>
