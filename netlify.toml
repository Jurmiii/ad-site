# Money Calendar — 정적 사이트. 배포 루트는 리포지터리 루트(.).
# Netlify UI Publish directory 를 `assets` 로 두지 마세요.
#
# pretty_urls: /assets/debt-list.html → /assets/debt-list 접근 가능
# 루트 Clean URL(/debt-list) rewrite 는 <base href="/assets/"> 의존으로
# Live Server·상대경로와 충돌하여 레이아웃이 깨지므로 사용하지 않습니다.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
