# Money Calendar
# HTML: pages/ | static: assets/
# Clean URL (200 rewrite). CSS/JS use /assets/... (no <base> tag)
# Live Server: open /pages/....html directly (no rewrite)

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/debt-list"
  to = "/pages/debt-list.html"
  status = 200
  force = true

