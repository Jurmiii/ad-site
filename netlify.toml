# Money Calendar — 정적 사이트. 배포(게시) 루트는 리포지터리 루트(.)이며, 메인 진입은 /index.html 입니다.
# Netlify UI에서 Publish directory 를 `assets` 로 두지 마세요(중복·경로 혼선만 유발).
#
# Clean URL: /debt-list  →  /assets/debt-list.html  (200 rewrite)
# 구 URL 301: /assets/debt-list.html  →  /debt-list

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ─── 1) 구 URL(/assets/…​.html) → Clean URL (301) ───────────────────────────

[[redirects]]
  from = "/assets/debt-list.html"
  to = "/debt-list"
  status = 301
  force = true

