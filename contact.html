    <style>
      .page-contact .contact-layout {
        display: flex;
        justify-content: center;
        padding-bottom: 2rem;
      }
      .page-contact .contact-inner {
        width: 100%;
        max-width: 32rem;
        min-width: 0;
        box-sizing: border-box;
      }
      .page-contact .contact-lead {
        margin: 0 0 1.25rem;
        text-align: center;
        font-size: 0.975rem;
        line-height: 1.75;
        font-weight: 650;
        color: var(--color-text-secondary);
        word-break: keep-all;
      }
      .page-contact .contact-card {
        padding: 1.5rem 1.375rem;
      }
      .page-contact .contact-field {
        margin-top: 1rem;
      }
      .page-contact .contact-field:first-of-type {
        margin-top: 0;
      }
      .page-contact .contact-field label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 800;
        color: var(--color-text-primary);
        margin-bottom: 0.375rem;
      }
      .page-contact .contact-field input[type="text"],
      .page-contact .contact-field input[type="email"],
      .page-contact .contact-field textarea {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .page-contact .contact-field textarea {
        min-height: 9rem;
        resize: vertical;
      }
      .page-contact .contact-consent {
        margin-top: 1.25rem;
        display: flex;
        gap: 0.625rem;
        align-items: flex-start;
      }
      .page-contact .contact-consent input[type="checkbox"] {
        margin-top: 0.2rem;
        flex-shrink: 0;
        width: 1.1rem;
        height: 1.1rem;
      }
      .page-contact .contact-consent label {
        font-size: 0.8125rem;
        font-weight: 650;
        line-height: 1.6;
        color: var(--color-text-secondary);
        cursor: pointer;
      }
      .page-contact .contact-consent a {
        color: var(--color-primary);
        font-weight: 750;
      }
      .page-contact .contact-actions {
        margin-top: 1.375rem;
      }
      .page-contact .contact-actions .btn {
        width: 100%;
        justify-content: center;
        min-height: 3rem;
      }
    </style>

  <body class="mc-app page-contact" data-mc-feature-id="0">
    <script>
      window.__MC_ASSETS_BASE = "./assets";
    </script>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="mc-global-header" role="banner">
      <div class="container mc-global-header__inner">
        <a class="mc-brand" href="./index.html">
          <span class="mc-brand__mark" aria-hidden="true">
            <img
              src="assets/images/icon/mc-logo.svg"
              width="44"
              height="44"
              alt="Money Calendar 머니캘린더 로고"
              loading="eager"
              decoding="async"
            />
          </span>
          <span class="mc-brand__titles">
            <span class="mc-brand__series">Money Calendar</span>
            <span class="mc-brand__page">문의하기</span>
          </span>
        </a>
        <div class="mc-global-header__tools">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="테마 전환" aria-pressed="false">
            <span class="theme-toggle__icon theme-toggle__sun" aria-hidden="true"></span>
            <span class="theme-toggle__thumb" aria-hidden="true"></span>
            <span class="theme-toggle__icon theme-toggle__moon" aria-hidden="true"></span>
          </button>
          <button
            class="mc-hamburger hamburger"
            type="button"
            aria-label="메뉴 열기"
            aria-controls="drawer"
            aria-expanded="false"
            id="drawer-open"
          >
            <span class="mc-hamburger__icon hamburger__icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="기능 메뉴" hidden>
      <div class="drawer__backdrop" data-drawer-close></div>
      <div class="drawer__panel" role="document">
        <div class="drawer__top">
          <p class="drawer__title">가계부 시리즈</p>
          <button class="drawer__close" type="button" aria-label="메뉴 닫기" data-drawer-close>닫기</button>
        </div>
        <nav class="drawer__nav" id="mc-drawer-list" aria-label="기능 1~15"></nav>
        <div class="drawer__meta">
          <p class="text-sm">작게 기록하고, 크게 흔들리지 않기.</p>
        </div>
      </div>
    </div>

    <div class="mc-app__canvas">
      <div class="container">
        <main id="main">
          <div class="contact-layout">
            <div class="contact-inner">
              <header class="mc-page-intro">
                <h1 class="mc-page-intro__title">문의하기</h1>
                <p class="mc-page-intro__kicker">Contact</p>
              </header>

              <p class="contact-lead">
                서비스 이용 중 불편한 점이나 제안 사항이 있으시면 언제든 남겨주세요. 확인 후 메일로 답변드리겠습니다.
              </p>

              <section class="card contact-card" aria-labelledby="contact-form-title">
                <h2 id="contact-form-title" class="visually-hidden">문의 양식</h2>
                <form name="contact" method="POST" data-netlify="true" action="/contact.html">
                  <input type="hidden" name="form-name" value="contact" />
                  <input type="hidden" name="redirect" value="/success.html" />

                  <div class="contact-field">
                    <label for="contact-name">성함</label>
                    <input
                      id="contact-name"
                      name="name"
                      type="text"
                      autocomplete="name"
                      required
                      maxlength="80"
                      placeholder="이름을 입력하세요"
                    />
                  </div>
                  <div class="contact-field">
                    <label for="contact-email">이메일</label>
                    <input
                      id="contact-email"
                      name="email"
                      type="email"
                      autocomplete="email"
                      inputmode="email"
                      required
                      maxlength="120"
                      placeholder="example@mail.com"
                    />
                  </div>
                  <div class="contact-field">
                    <label for="contact-message">문의 내용</label>
                    <textarea
                      id="contact-message"
                      name="message"
                      required
                      maxlength="8000"
                      placeholder="문의 내용을 입력하세요"
                    ></textarea>
                  </div>

                  <div class="contact-consent">
                    <input id="contact-consent" name="privacy-consent" type="checkbox" value="yes" required />
                    <label for="contact-consent">
                      입력하신 성함·이메일·문의 내용은 문의 접수 및 회신 목적으로만 이용되며,
                      <a href="./legal.html#privacy" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>에 따라
                      처리됩니다. 내용에 동의합니다.
                    </label>
                  </div>

                  <div class="contact-actions">
                    <button class="btn btn--block" type="submit">문의 보내기</button>
                  </div>
                </form>
              </section>

              <footer class="page-foot mt-24 mb-20">
                <p class="text-sm text-center">
                  © 2026 Money Calendar. All rights reserved. | <a href="/legal.html#privacy">개인정보처리방침</a> |
                  <a href="/legal.html#terms">이용약관</a>
                </p>
              </footer>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/js/nav-config.js"></script>
    <script src="assets/js/app-shell.js"></script>
  </body>
